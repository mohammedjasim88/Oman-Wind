
name: Build Oman Wind iPhone IPA (unsigned)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oman-wind-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-unsigned:
    name: Build Flutter iOS IPA
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create iOS native folder
        run: |
          flutter --version
          flutter create --project-name oman_wind_explorer --org om.edu.wind --platforms=ios .
          flutter pub get

      - name: Remove incompatible default test
        run: |
          if [ -f test/widget_test.dart ] && grep -Fq "MyApp(" test/widget_test.dart; then
            rm test/widget_test.dart
            echo "Removed incompatible default MyApp test."
          fi

      - name: Analyze Flutter code
        run: flutter analyze --no-fatal-infos

      - name: Run available unit tests
        run: |
          if [ -d test ] && find test -type f -name '*_test.dart' | grep -q .; then
            flutter test
          else
            echo "No unit tests available. Skipping tests."
          fi

      - name: Build iOS without signing
        run: flutter build ios --release --no-codesign

      - name: Package Runner.app as unsigned IPA
        run: |
          test -d build/ios/iphoneos/Runner.app
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload Oman-Wind-unsigned.ipa
          test -s Oman-Wind-unsigned.ipa

      - name: Upload IPA for Sideloadly
        uses: actions/upload-artifact@v4
        with:
          name: Oman-Wind-IPA-for-Sideloadly
          path: Oman-Wind-unsigned.ipa
          retention-days: 7
          if-no-files-found: error
