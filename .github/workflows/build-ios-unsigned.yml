name: Build Oman Wind iPhone IPA (unsigned)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oman-wind-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-unsigned:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create iOS native folder
        run: |
          flutter --version
          flutter create --project-name oman_wind_explorer --org om.edu.wind --platforms=ios .
          flutter pub get
          bash scripts/apply_icon_macos.sh

      - name: Check code and tests
        run: |
          rm -f test/widget_test.dart
          flutter analyze --no-fatal-infos
          flutter test

      - name: Build iOS without signing
        run: flutter build ios --release --no-codesign

      - name: Package Runner.app as unsigned IPA
        run: |
          test -d build/ios/iphoneos/Runner.app
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload Oman-Wind-unsigned.ipa
          test -s Oman-Wind-unsigned.ipa

      - name: Upload IPA for Sideloadly
        uses: actions/upload-artifact@v4
        with:
          name: Oman-Wind-IPA-for-Sideloadly
          path: Oman-Wind-unsigned.ipa
          retention-days: 7
          if-no-files-found: error
