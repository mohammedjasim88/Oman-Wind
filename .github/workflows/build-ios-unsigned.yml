
name: Build Oman Wind iPhone IPA (unsigned)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oman-wind-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-unsigned:
    name: Build Flutter iOS IPA
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      # Step 1: Download project
      - name: Download project
        uses: actions/checkout@v4

      # Step 2: Install Flutter
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Step 3: Generate iOS project
      - name: Create iOS native folder
        run: |
          flutter --version
          flutter create --project-name oman_wind_explorer --org om.edu.wind --platforms=ios .
          flutter pub get

      # Step 4: Check code and run tests
      - name: Check code and tests
        run: |
          rm -f test/widget_test.dart
          flutter analyze --no-fatal-infos
          flutter test

      # Step 5: Build iPhone application
      - name: Build iOS without signing
        run: flutter build ios --release --no-codesign

      # Step 6: Create IPA file
      - name: Package Runner.app as unsigned IPA
        run: |
          test -d build/ios/iphoneos/Runner.app
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload Oman-Wind-unsigned.ipa
          test -s Oman-Wind-unsigned.ipa

      # Step 7: Upload IPA
      - name: Upload IPA for Sideloadly
        uses: actions/upload-artifact@v4
        with:
          name: Oman-Wind-IPA-for-Sideloadly
          path: Oman-Wind-unsigned.ipa
          retention-days: 7
          if-no-files-found: error
